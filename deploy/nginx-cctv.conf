# Konfigurasi reverse proxy untuk aaPanel.
#
# Cara pakai: aaPanel -> Website -> (domain Anda) -> Config File, lalu tempel
# blok-blok location di bawah SEBELUM location "/" bawaan aaPanel.
#
# ============================================================================
# PENTING — JANGAN proxy /stream-proxy atau /webrtc-proxy langsung ke MediaMTX.
# ============================================================================
# Godaan besarnya adalah mengarahkan /stream-proxy langsung ke 127.0.0.1:8888
# karena "toh sama saja". Itu MEMBYPASS middleware Next yang memeriksa grant
# menonton, dan seluruh kontrol akses kamera privat hilang. Semua trafik harus
# lewat Next di 127.0.0.1:3000; Next yang meneruskannya ke MediaMTX.
#
# Template reverse proxy bawaan aaPanel juga menyalakan proxy_cache dan
# proxy_buffering. Keduanya harus dimatikan untuk jalur media: playlist HLS
# berubah tiap detik, dan buffering menambah latensi pada sesuatu yang justru
# dikejar sub-detik.

# --- Jalur media: WebRTC signaling + HLS fallback ---
location ~ ^/(stream-proxy|webrtc-proxy)/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Wajib: streaming tidak boleh di-buffer atau di-cache.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;

    # LL-HLS memakai blocking playlist request yang menahan koneksi.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}

# --- Thumbnail: boleh di-cache, tapi beri waktu untuk tangkapan pertama ---
location /thumbnail/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Tangkapan pertama untuk kamera yang belum punya cache menunggu keyframe.
    proxy_read_timeout 30s;
}

# --- Aliran deteksi HSE (Server-Sent Events) ---
# Blok terpisah karena SSE punya dua syarat yang tidak dipenuhi location "/":
# koneksinya menganggur di antara kejadian (timeout bawaan 60 detik memutusnya
# terus-menerus), dan responsnya di-buffer sampai koneksi tutup — yang berarti
# tidak pernah sampai. Aplikasi sudah mengirim X-Accel-Buffering: no, tapi
# menegaskannya di sini membuat perilakunya tidak bergantung pada satu header.
location /hse/live/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE bukan HTTP/1.0 dan tidak boleh membawa header koneksi warisan.
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Overlay membuka koneksi selama halaman kamera terbuka.
    proxy_read_timeout 1h;
}

# --- Sisa aplikasi ---
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
